<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labb 2 - Grupp 23</title>
    <style>
body {
  margin: 0;
  min-height: 100vh;
  box-sizing: border-box;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 24px;
  background-color: #1f2e49;
  color: rgb(255, 255, 255);
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  font-size: 2.5rem;
}
.panel {
  display: grid;
  grid-template-columns: 0.85fr 2fr;
  gap: 28px 24px;
  width: 65%;
  margin: 0 auto;
  padding: 48px 40px;
  background-color: #e5e4ea;
  border-radius: 16px;
  color: #333;
  box-sizing: border-box;
}
.panel label {
  align-self: center;
  font-size: 1.25rem;
}

.panel input[type="text"] {
  box-sizing: border-box;
  width: 100%;
  height: 32px;
  padding: 8px;
  border: 2px solid #37465f;
  border-radius: 8px;
  font-size: 1.1rem;
}
#divStyle {
  appearance: none;
  justify-self: start;
  width: 22px;
  height: 22px;
  border: 2px solid #37465f;
  border-radius: 4px;
  background-color: white;
  cursor: pointer;
}

#divStyle:checked {
  background-color: #37465f;
}

#removeButton {
  width: 120px;
  height: 40px;
  border: 2px solid #37465f;
  border-radius: 8px;
  background-color: #e1e5ed;
  font-size: 1.25rem;
  cursor: pointer;
}

#displayDiv {
  grid-column: 1 / -1;
  min-height: 80px;
  padding: 12px;
  border: 2px solid #333;
  box-sizing: border-box;
  border-radius: 2px;
}
</style>
</head>
<body><h1>Labb 2 - Grupp 23</h1>
    <main class="panel">
    <label for="color">Färg</label>
    <input type="text" id="color" name="color" class="textfield">
    <label for="content">Innehåll:</label>
    <input type="text" id="content" name="content" class="textfield">
    <label for="divStyle">Stil på box</label>
    <input type="checkbox" name="divStyle" 
    id="divStyle" class="checkbox">
    <button type ="button" id="removeButton">Ta bort</button>
    <div id="displayDiv"></div> 
</main>
    <script src="script.js"></script>
</body>
</html>
